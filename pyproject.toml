[build-system]
requires = ["maturin==1.12.6"]
build-backend = "maturin"

[project]
name = "zippy"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = [
    "zippy-client==0.1.0",
    "click>=8.1.0",
    "fastapi>=0.115.0",
    "polars>=1.25.0",
    "pyarrow>=23.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
zippy = "zippy.cli:main"

[project.optional-dependencies]
dev = [
    "black>=24.10.0",
    "maturin==1.12.6",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.maturin]
module-name = "zippy._internal"
python-source = "python"
manifest-path = "crates/zippy-python/Cargo.toml"
features = ["extension-module"]
include = [
    { path = "python/zippy/assets/zippy-logo.png", format = ["sdist", "wheel"] },
    { path = "python/zippy/webui_static/**/*", format = ["sdist", "wheel"] },
]

[tool.uv.sources]
zippy-client = { workspace = true }

[tool.uv.workspace]
members = ["clients/python"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
    "python",
    "pytests",
    "scripts",
    "examples",
    "clients/python/src",
    "clients/python/tests",
]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false

[dependency-groups]
protocol = [
    "grpcio-tools==1.81.1",
    "black==26.3.1",
]
