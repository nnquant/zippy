name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows-check:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: run windows cargo check
        run: cargo check --workspace

  verify:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: checkout rspm python dependency
        uses: actions/checkout@v4
        with:
          repository: nnquant/rspm
          ref: 520d3d6c497afd05b8e3d965ef6d04f7422c023e
          path: .ci-deps/rspm
          persist-credentials: false

      - name: expose rspm sibling source
        run: ln -s "$GITHUB_WORKSPACE/.ci-deps/rspm" "$GITHUB_WORKSPACE/../rspm"

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: setup uv
        uses: astral-sh/setup-uv@v4

      - name: sync python dependencies
        run: uv sync --locked --extra dev --no-install-project

      - name: run rust tests
        run: cargo test --workspace

      - name: run zmq feature tests
        run: cargo test -p zippy-io --features zmq-publisher

      - name: run rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: compile benches
        run: cargo bench -p zippy-engines --no-run

      - name: install python extension
        run: uv run maturin develop --manifest-path crates/zippy-python/Cargo.toml

      - name: check python formatting
        run: uv run --extra dev black --check python pytests

      - name: run python ruff
        run: uv run --extra dev ruff check python pytests

      - name: run python mypy
        run: uv run --extra dev mypy

      - name: run python tests
        run: uv run --extra dev pytest pytests -v
