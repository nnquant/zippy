name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows-check:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: setup uv
        uses: astral-sh/setup-uv@v4

      - name: run windows cargo check
        run: cargo check --workspace

      - name: install windows lightweight client extension
        working-directory: clients/python
        run: uv run --extra dev maturin develop

      - name: run windows lightweight client contracts
        working-directory: clients/python
        run: >-
          uv run --extra dev pytest
          tests/test_endpoints_router.py
          tests/test_expressions_protocol.py
          tests/test_unit_contracts.py
          --no-cov -v

  verify:
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: checkout rspm python dependency
        uses: actions/checkout@v4
        with:
          repository: nnquant/rspm
          ref: 520d3d6c497afd05b8e3d965ef6d04f7422c023e
          path: .ci-deps/rspm
          persist-credentials: false

      - name: expose rspm sibling source
        run: ln -s "$GITHUB_WORKSPACE/.ci-deps/rspm" "$GITHUB_WORKSPACE/../rspm"

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: setup uv
        uses: astral-sh/setup-uv@v4

      - name: sync python dependencies
        run: uv sync --locked --extra dev --no-install-project

      - name: run rust tests
        run: cargo test --workspace

      - name: run zmq feature tests
        run: cargo test -p zippy-io --features zmq-publisher

      - name: run rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: compile benches
        run: cargo bench -p zippy-engines --no-run

      - name: install python extension
        run: uv run maturin develop --manifest-path crates/zippy-python/Cargo.toml

      - name: install lightweight client extension
        working-directory: clients/python
        run: uv run --extra dev maturin develop

      - name: check python formatting
        run: uv run --extra dev black --check python pytests

      - name: run python ruff
        run: uv run --extra dev ruff check python pytests

      - name: run python mypy
        run: uv run --extra dev mypy

      - name: run python tests
        run: uv run --extra dev pytest pytests -v

      - name: check lightweight client formatting
        run: uv run --project clients/python --extra dev black --check clients/python/src clients/python/tests

      - name: run lightweight client ruff
        run: uv run --project clients/python --extra dev ruff check clients/python/src clients/python/tests

      - name: run lightweight client mypy
        run: uv run --project clients/python --extra dev mypy clients/python/src/zippy_client clients/python/tests

      - name: run lightweight client tests
        run: uv run --project clients/python --extra dev pytest clients/python/tests -v
