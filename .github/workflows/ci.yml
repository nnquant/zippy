name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  client-distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dependency-set:
          - python: "3.11"
            arrow: "23.0.1"
          - python: "3.14"
            arrow: "25.0.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.dependency-set.python }}
      - uses: astral-sh/setup-uv@v4
      - name: verify client archive without Rust or server
        run: >-
          python scripts/check_distributions.py --client-only
          --arrow-version ${{ matrix.dependency-set.arrow }}
          --work-dir "${{ runner.temp }}/zippy-client-distribution"

  windows-check:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: setup pinned rust
        run: python scripts/setup_rust_toolchain.py

      - name: setup uv
        uses: astral-sh/setup-uv@v4

      - name: run windows cargo check
        run: cargo check --workspace

      - name: install windows lightweight client
        working-directory: clients/python
        run: uv sync --locked --package zippy-client --extra dev

      - name: run windows lightweight client contracts
        working-directory: clients/python
        run: >-
          uv run --extra dev pytest
          tests/test_endpoints_router.py
          tests/test_expressions_protocol.py
          tests/test_unit_contracts.py
          --no-cov -v

  verify:
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: setup pinned rust
        run: python scripts/setup_rust_toolchain.py

      - name: setup uv
        uses: astral-sh/setup-uv@v4

      - name: sync python dependencies
        run: uv sync --locked --extra dev --group protocol --no-install-project

      - name: verify generated protocol
        run: uv run --locked --group protocol scripts/generate_protocol.py --check

      - name: check protocol generator
        run: |
          cargo fmt --manifest-path tools/protocol-codegen/Cargo.toml --check
          cargo clippy --locked --manifest-path tools/protocol-codegen/Cargo.toml --all-targets -- -D warnings

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/zippy-console/package-lock.json

      - name: build console
        working-directory: app/zippy-console
        run: |
          npm ci
          npm run build

      - name: verify packaged console
        run: uv run --locked scripts/check_frontend_bundle.py

      - name: run rust tests
        run: cargo test --workspace


      - name: run rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: compile benches
        run: cargo bench -p zippy-engines --no-run

      - name: install python extension
        run: uv run maturin develop --manifest-path crates/zippy-python/Cargo.toml

      - name: install lightweight client
        working-directory: clients/python
        run: uv sync --locked --package zippy-client --extra dev --inexact --no-install-package zippy

      - name: check python formatting
        run: uv run --extra dev black --check --line-length 100 .

      - name: run python ruff
        run: uv run --extra dev ruff check .

      - name: run python mypy
        run: uv run --extra dev mypy

      - name: run python tests
        run: uv run --extra dev pytest pytests -v

      - name: check lightweight client formatting
        run: uv run --project clients/python --extra dev black --check clients/python/src clients/python/tests

      - name: run lightweight client ruff
        run: uv run --project clients/python --extra dev ruff check clients/python/src clients/python/tests

      - name: run lightweight client mypy
        run: uv run --project clients/python --extra dev mypy clients/python/src/zippy_client clients/python/tests

      - name: run lightweight client tests
        run: uv run --project clients/python --extra dev pytest clients/python/tests -v

      - name: verify native Python client and Rust server recovery
        run: uv run --no-sync scripts/check_native_client.py

      - name: verify archive distributions in isolation
        run: uv run --no-sync scripts/check_distributions.py --work-dir /tmp/zippy-distributions
