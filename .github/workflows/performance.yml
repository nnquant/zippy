name: performance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"

jobs:
  zippy-perf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pinned rust
        run: python scripts/setup_rust_toolchain.py

      - name: run synchronous timeseries kernel profile
        run: |
          cargo run -p zippy-perf --release -- timeseries-kernel \
            --rows-per-batch 4096 \
            --target-rows-per-sec 1000000 \
            --duration-sec 10 \
            --warmup-sec 2 \
            --symbols 1024 \
            --max-p95-micros 5000 \
            --max-p99-micros 10000 \
            --report-json target/zippy-perf-timeseries-kernel.json

      - name: run stream table copy profile
        run: |
          cargo run -p zippy-perf --release -- stream-table-segment-copy \
            --rows-per-batch 4096 \
            --target-rows-per-sec 1000000 \
            --duration-sec 10 \
            --warmup-sec 2 \
            --symbols 1024 \
            --max-p95-micros 5000 \
            --max-p99-micros 20000 \
            --report-json target/zippy-perf-stream-table-copy.json

      - name: run write-to-subscribe profile
        env:
          TMPDIR: /dev/shm
        run: |
          cargo run -p zippy-perf --release -- write-to-subscribe-e2e \
            --rows-per-batch 1 \
            --target-rows-per-sec 200 \
            --duration-sec 10 \
            --warmup-sec 2 \
            --symbols 32 \
            --max-p95-micros 1000 \
            --max-p99-micros 5000 \
            --report-json target/zippy-perf-write-to-subscribe-e2e.json

      - name: upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zippy-perf-reports
          path: target/zippy-perf-*.json
