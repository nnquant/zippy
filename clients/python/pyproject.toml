[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zippy-client"
version = "0.1.0"
description = "Lightweight local and remote Python client for Zippy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.0",
    "protobuf>=6.33.5,<7",
    "pyarrow>=23.0.0",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["zippy_client*"]

[tool.setuptools.package-data]
zippy_client = ["py.typed", "*.pyi"]
"zippy_client._generated" = ["*.pyi"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "src/zippy_client/_generated"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/zippy_client/_generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src/zippy_client", "tests"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=zippy_client",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.70,<2",
]
