syntax = "proto3";

package zippy.flight.v1;

message SessionOpenRequest {
  uint32 protocol_version = 1;
}

message SessionOpenResponse {
  uint32 protocol_version = 1;
  bytes session_id = 2;
  string bearer_token = 3;
  uint64 expires_at_ns = 4;
  SessionRole role = 5;
}

// Close only the session authenticated by this RPC, never a caller-supplied identity.
message SessionCloseRequest {
  uint32 protocol_version = 1;
}

message SessionCloseResponse {
  uint32 protocol_version = 1;
  bool closed = 2;
}

enum SessionRole {
  SESSION_ROLE_UNSPECIFIED = 0;
  SESSION_ROLE_READ = 1;
  SESSION_ROLE_ADMINISTRATOR = 2;
  SESSION_ROLE_WRITER = 3;
}

message PutCommand {
  uint32 protocol_version = 1;
  bytes session_id = 2;
  bytes put_id = 3;
  string stream_name = 4;
  uint64 first_batch_sequence = 5;
  PutMutation mutation = 6;
  PutDurability durability = 7;
  bytes producer_id = 8;
  bytes connection_id = 9;
  optional uint64 expected_writer_epoch = 10;
  string namespace = 11;
  // Reject name reuse before acquiring a producer or accepting any batch.
  optional bytes expected_table_id = 12;
}

enum PutMutation {
  PUT_MUTATION_UNSPECIFIED = 0;
  PUT_MUTATION_APPEND = 1;
  PUT_MUTATION_FRAME = 2;
  PUT_MUTATION_KEY_VALUE_UPSERT = 3;
  PUT_MUTATION_KEY_VALUE_DELETE = 4;
}

enum PutDurability {
  PUT_DURABILITY_UNSPECIFIED = 0;
  PUT_DURABILITY_MEMORY = 1;
  PUT_DURABILITY_WAL = 2;
  PUT_DURABILITY_PERSISTED = 3;
}

message PutBatchResult {
  uint32 protocol_version = 1;
  bytes put_id = 2;
  uint64 batch_sequence = 3;
  uint64 row_count = 4;
  PutDurability durability_reached = 5;
  bytes request_id = 6;
  uint64 producer_epoch = 7;
  optional uint64 first_log_offset = 8;
  optional uint64 last_log_offset = 9;
  OffsetWatermark previous_log_offset = 10;
  OffsetWatermark committed_log_offset = 11;
  optional uint64 persisted_snapshot_version = 12;
}

message QueryCommand {
  uint32 protocol_version = 1;
  bytes query_id = 2;
  bytes session_id = 3;
  string sql = 4;
  repeated TableBinding bindings = 5;
  QueryPriority priority = 6;
  optional uint64 deadline_ns = 7;
  ResourceLimit memory_limit = 8;
  ResourceLimit spill_limit = 9;
  optional uint32 result_batch_rows = 10;
  // Requires the canonical single-table full-state query; cursor metadata shares its snapshot.
  bool key_value_snapshot = 11;
  // Opaque, session-owned fixed boundary; never resolve a fresh snapshot on failure.
  optional bytes fixed_snapshot_id = 12;
}

message TableBinding {
  string sql_name = 1;
  oneof table {
    TableName name = 2;
    bytes table_id = 3;
  }
}

message TableName {
  string namespace = 1;
  string table = 2;
}

enum QueryPriority {
  QUERY_PRIORITY_UNSPECIFIED = 0;
  QUERY_PRIORITY_INTERACTIVE = 1;
  QUERY_PRIORITY_NORMAL = 2;
  QUERY_PRIORITY_MAINTENANCE = 3;
}

message ResourceLimit {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_SERVER_DEFAULT = 1;
    KIND_DISABLED = 2;
    KIND_BYTES = 3;
  }
  Kind kind = 1;
  uint64 bytes = 2;
}

message QueryTicket {
  uint32 protocol_version = 1;
  bytes server_instance_id = 2;
  bytes ticket_id = 3;
  bytes query_id = 4;
  uint64 generation = 5;
  uint64 expires_at_ns = 6;
}

message MetadataTicket {
  uint32 protocol_version = 1;
  bytes server_instance_id = 2;
  bytes ticket_id = 3;
  uint64 catalog_revision = 4;
  uint64 expires_at_ns = 5;
}

message MetadataInfo {
  uint32 protocol_version = 1;
  uint64 catalog_revision = 2;
  uint64 expires_at_ns = 3;
}

message QueryInfo {
  uint32 protocol_version = 1;
  bytes query_id = 2;
  uint64 generation = 3;
  uint64 catalog_revision = 4;
  uint64 planned_at_ns = 5;
  uint64 expires_at_ns = 6;
  repeated QueryTableVersion snapshots = 7;
}

message QueryTableVersion {
  bytes table_id = 1;
  uint64 snapshot_version = 2;
  uint64 schema_version = 3;
}

message ErrorEnvelope {
  uint32 protocol_version = 1;
  string code = 2;
  string message = 3;
  bool retryable = 4;
  optional bytes request_id = 5;
  optional bytes query_id = 6;
  optional bytes table_id = 7;
  oneof details {
    RevisionConflict revision_conflict = 10;
    ExpectedActual producer_epoch = 11;
    ExpectedActual sequence_gap = 12;
    ExpectedActual schema_version = 13;
    OffsetExpired offset_expired = 14;
    ResourceLimitExceeded resource_limit = 15;
    DataCorruption data_corruption = 16;
    UnsupportedPlan unsupported_plan = 17;
  }
}

message RevisionConflict {
  uint64 expected = 1;
  uint64 actual = 2;
}

message ExpectedActual {
  uint64 expected = 1;
  uint64 actual = 2;
}

message OffsetExpired {
  OffsetWatermark requested = 1;
  OffsetWatermark earliest = 2;
  OffsetWatermark latest = 3;
  bool snapshot_recovery_available = 4;
}

message OffsetWatermark {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_EMPTY = 1;
    STATE_KNOWN = 2;
    reserved 3;
    reserved "STATE_LEGACY_UNKNOWN";
  }
  State state = 1;
  uint64 offset = 2;
}

message ResourceLimitExceeded {
  string resource = 1;
  ResourceLimit limit = 2;
  uint64 requested = 3;
}

message DataCorruption {
  string object = 1;
  optional string expected_checksum = 2;
  optional string actual_checksum = 3;
}

message UnsupportedPlan {
  string operator = 1;
}

message CapabilitiesRequest {
  uint32 protocol_version = 1;
}

message CapabilitiesResponse {
  uint32 protocol_version = 1;
  string server_version = 2;
  repeated string capabilities = 3;
  uint64 max_message_bytes = 4;
  uint64 max_pending_tickets = 5;
  bool authentication_required = 6;
  uint64 session_ttl_ms = 7;
  bool administrator_authentication_enabled = 8;
  uint64 metadata_max_rows = 9;
  uint64 metadata_max_bytes = 10;
  bool writer_authentication_enabled = 11;
  bool ingest_enabled = 12;
  uint64 ingest_max_concurrent_puts = 13;
  uint64 ingest_max_batches_per_put = 14;
  uint64 ingest_max_rows_per_batch = 15;
  uint64 ingest_max_rows_per_put = 16;
  uint64 ingest_max_batch_bytes = 17;
  uint64 ingest_max_bytes_per_put = 18;
  uint64 ingest_max_rows_per_frame = 19;
}

// Stable caller-assigned identities allow retries after an interrupted response.
message CreateNamespaceRequest {
  uint32 protocol_version = 1;
  bytes request_id = 2;
  bytes namespace_id = 3;
  string name = 4;
}

message CreateTableRequest {
  uint32 protocol_version = 1;
  bytes request_id = 2;
  bytes table_id = 3;
  bytes namespace_id = 4;
  string name = 5;
  bytes schema_ipc = 6;
  oneof definition {
    AppendTableOptions append = 7;
    FrameTableOptions frame = 8;
    KeyValueTableOptions key_value = 9;
  }
}

// Logical deletion guarded by the caller's observed immutable snapshot version.
message DropTableRequest {
  uint32 protocol_version = 1;
  bytes request_id = 2;
  bytes table_id = 3;
  uint64 expected_snapshot_version = 4;
}

// Logical user schema; key-value callers explicitly retain the same ordered primary keys.
message AlterTableSchemaRequest {
  uint32 protocol_version = 1;
  bytes request_id = 2;
  bytes table_id = 3;
  uint64 expected_schema_version = 4;
  bytes schema_ipc = 5;
  KeyValueTableOptions key_value = 6;
}

message AppendTableOptions {
  optional string event_time_column = 1;
}

message FrameTableOptions {
  string by = 1;
}

message KeyValueTableOptions {
  repeated string keys = 1;
}

message CatalogMutationResult {
  uint32 protocol_version = 1;
  bytes request_id = 2;
  uint64 catalog_revision = 3;
  bytes object_id = 4;
  uint64 schema_version = 5;
}

// Ordered native logs with optional durable, atomic-unit acknowledgement.
message LogCommand {
  uint32 protocol_version = 1;
  bytes query_id = 2;
  bytes session_id = 3;
  TableBinding table = 4; // sql_name must be empty
  oneof start {
    bool latest = 5; // must be true; captures the opening watermark
    uint64 offset = 6; // inclusive
    bool committed = 11; // true and consumer required
  }
  optional uint64 deadline_ns = 7;
  ResourceLimit memory_limit = 8;
  optional uint32 batch_rows = 9;
  LogConsumer consumer = 10;
}

message LogConsumer {
  bytes consumer_id = 1;
  oneof authority {
    bool individual = 2;
    bytes group_id = 3;
  }
}

message LogAcknowledgement {
  bytes request_id = 1;
  uint64 delivery_sequence = 2;
  uint64 processed_through = 3;
}

message LogControl {
  uint32 protocol_version = 1;
  oneof control {
    bool cancel = 2;
    LogAcknowledgement acknowledge = 3;
  }
}

message LogMetadata {
  oneof payload {
    LogOpened opened = 1;
    LogProgress progress = 2;
    LogAcknowledgement acknowledged = 3;
  }
}

message LogOpened {
  uint32 protocol_version = 1;
  bytes query_id = 2;
  uint64 generation = 3;
  bytes table_id = 4;
  string table_kind = 5; // append, frame, key_value
  OffsetWatermark watermark = 6;
  LogConsumer consumer = 7;
  optional uint64 next_offset = 8;
}

message LogProgress {
  uint64 first_offset = 1;
  uint64 last_offset = 2;
  optional uint64 frame_first_offset = 3;
  optional uint64 frame_last_offset = 4;
  OffsetWatermark watermark = 5;
  optional uint64 delivery_sequence = 6;
  optional uint64 delivery_last_offset = 7;
}


message CreateFixedSnapshotRequest {
  uint32 protocol_version = 1;
  repeated TableBinding bindings = 2;
  uint64 ttl_ms = 3;
}

message FixedSnapshotInfo {
  uint32 protocol_version = 1;
  bytes snapshot_id = 2;
  uint64 expires_at_ns = 3;
  uint64 catalog_revision = 4;
  repeated QueryTableVersion tables = 5;
}

message ReleaseFixedSnapshotRequest {
  uint32 protocol_version = 1;
  bytes snapshot_id = 2;
}

message ReleaseFixedSnapshotResult {
  uint32 protocol_version = 1;
  bool released = 2;
}
